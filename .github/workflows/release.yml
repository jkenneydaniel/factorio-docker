name: Package alpha release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - name: Verify tag matches tested package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node --input-type=module -e "import fs from 'node:fs'; if(process.env.RELEASE_TAG!=='v'+JSON.parse(fs.readFileSync('panel/package.json')).version) process.exit(1)"
      - run: npm test --prefix panel
      - run: docker compose --env-file .env.example config --quiet
      - run: docker build -t local/factory-control:0.1.0-alpha panel
      - run: node tools/release.mjs
      - name: Attach source and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256 dist/*.manifest.txt
