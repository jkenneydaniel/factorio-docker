name: Compatible Factorio image
on:
  push:
    paths: ['factorio-image/**', 'tools/factorio-image.mjs', 'panel/public/game-images.js', 'panel/update-worker.js', '.github/workflows/factorio-image.yml']
  pull_request:
    paths: ['factorio-image/**', 'tools/factorio-image.mjs', 'panel/public/game-images.js', 'panel/update-worker.js', '.github/workflows/factorio-image.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested image to GHCR (does not deploy servers)
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: factorio-image
  cancel-in-progress: false
jobs:
  compatible-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@v4
      - run: node --test panel/test/game-images.test.js factorio-image/test-build.mjs
      - run: python3 -B factorio-image/test_runtime.py
      - name: Build the pinned compatible image
        run: node tools/factorio-image.mjs build
      - name: Test old-save loading, RCON, settings, graceful save and reload
        run: node tools/factorio-image.mjs test
      - name: Select the tested tag
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.repository == 'jkenneydaniel/factorio-docker'
        run: node --input-type=module -e "import {imageDefinition} from './tools/factorio-image.mjs'; import fs from 'node:fs'; fs.appendFileSync(process.env.GITHUB_ENV,'IMAGE_TAG='+(await imageDefinition()).image+'\n')"
      - uses: docker/login-action@v4
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.repository == 'jkenneydaniel/factorio-docker'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse an existing tag, then publish the tested image
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.repository == 'jkenneydaniel/factorio-docker'
        shell: bash
        run: |
          if docker buildx imagetools inspect "$IMAGE_TAG" > /tmp/existing-image 2> /tmp/image-error; then
            echo "This image tag already exists. Increment the image revision instead of overwriting it."
            exit 1
          fi
          if ! grep -qi 'manifest unknown\|not found' /tmp/image-error; then
            cat /tmp/image-error
            exit 1
          fi
          docker push "$IMAGE_TAG"
