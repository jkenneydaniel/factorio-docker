<template id="heading">
  <div class="page-heading">
    <div>
      <div class="eyebrow" data-part="eyebrow"></div>
      <h1></h1>
      <p></p>
    </div>
    <div class="button-group"></div>
  </div>
</template>
<template id="readonly"><div class="readonly-note"></div></template>
<template id="warning"><div class="warning"></div></template>
<template id="job-banner"
  ><div class="job-banner">
    <span class="spinner"></span><span data-part="message"></span></div
></template>
<template id="card"
  ><section class="card">
    <div class="card-header">
      <h2></h2>
      <span data-part="link"></span>
    </div>
    <div class="card-body"></div></section
></template>
<template id="empty"
  ><div class="empty-state">
    <div class="empty-symbol" data-icon="folder"></div>
    <span data-part="title"></span>
    <p></p></div
></template>
<template id="action"
  ><button class="button">
    <span data-part="icon"></span><span data-part="label"></span></button
></template>
